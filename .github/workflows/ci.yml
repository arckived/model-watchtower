name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  docker-stack:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start all containers
        run: docker compose up --build -d

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then echo " API is up"; exit 0; fi
            sleep 2
          done
          echo "API did not start"; exit 1

      - name: Send test traffic
        run: docker compose exec -T api python -m app.traffic --requests 50 --delay 0

      - name: Check the API exposes metrics
        run: curl -s http://localhost:8000/metrics | grep model_predictions_total

      - name: Check Prometheus is collecting metrics
        run: |
          for i in $(seq 1 15); do
            if curl -s http://localhost:9090/api/v1/targets | grep -q '"health":"up"'; then echo "Prometheus target is up"; exit 0; fi
            sleep 2
          done
          echo "Prometheus is not scraping the API"; exit 1

      - name: Check Grafana is running
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/api/health; then echo " Grafana is up"; exit 0; fi
            sleep 2
          done
          echo "Grafana did not start"; exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
